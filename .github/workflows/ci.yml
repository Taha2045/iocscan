name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Unit tests
        run: make test
      - name: Sanitizers
        run: make sanitize
      - name: ThreadSanitizer
        run: make tsan
